<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Vector Search</title>
    <!-- Tailwind CSS for modern, instant styling without installations -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Subtle hovering animation for the central logo */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex flex-col items-center pt-24 px-6 font-sans antialiased selection:bg-indigo-500 selection:text-white">
    
    <!-- 1. The SVG Logo: Abstract Neural / Vector Mesh -->
    <div class="mb-6 animate-float">
        <svg class="w-24 h-24 text-indigo-500 drop-shadow-[0_0_15px_rgba(99,102,241,0.4)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z" />
            <path d="M2 17l10 5 10-5" />
            <path d="M2 12l10 5 10-5" />
        </svg>
    </div>

    <!-- Header Section -->
    <!-- Header Section -->
    <h1 class="text-4xl font-extrabold tracking-tight mb-3 text-white">A<span class="text-indigo-500">sync</span></h1>
    <p class="text-slate-400 mb-10 text-center max-w-md">Semantic vector search powered by <code class="bg-slate-800 text-indigo-300 px-1.5 py-0.5 rounded text-sm">all-MiniLM-L6-v2</code> and FAISS.</p>

    <!-- 2. The Search Box -->
    <div class="relative w-full max-w-2xl mb-8 group">
        <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
            <!-- Search Icon SVG -->
            <svg class="w-5 h-5 text-slate-500 group-focus-within:text-indigo-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        </div>
        <input type="text" id="searchInput" class="w-full bg-slate-800 border border-slate-700 text-white rounded-full py-4 pl-14 pr-36 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent shadow-lg transition-all text-lg placeholder-slate-500" placeholder="Search by concept or meaning...">
        <button onclick="performSearch()" class="absolute inset-y-1.5 right-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-full px-6 transition-colors duration-200">
            Search
        </button>
    </div>

    <!-- Crawler Controls -->
    <div class="flex flex-col items-center space-y-3 mb-12">
        <button onclick="startCrawler()" class="flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 px-5 py-2.5 rounded-full text-sm transition-colors text-slate-300 hover:text-white shadow-sm">
            <!-- Lightning Bolt SVG -->
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            <span>Run Web Crawler</span>
        </button>
        <span id="statusText" class="text-sm text-slate-500 hidden animate-pulse">Initializing background vector encoding...</span>
    </div>

    <!-- Results Container -->
    <div id="results" class="w-full max-w-2xl space-y-4 pb-20">
        <!-- JavaScript will inject result cards here -->
    </div>

    <script>
        async function performSearch() {
            const query = document.getElementById('searchInput').value;
            const resultsDiv = document.getElementById('results');
            
            if (!query) return;
            
            resultsDiv.innerHTML = '<div class="text-center text-slate-500 mt-8">Calculating vector distances...</div>';
            
            try {
                // Adjust URL if your FastAPI endpoint name is different
                const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                resultsDiv.innerHTML = '';
                
                if (data.results && data.results.length > 0) {
                    data.results.forEach(res => {
                        // Renders a sleek card for each semantic match
                        resultsDiv.innerHTML += `
                            <div class="bg-slate-800/50 border border-slate-700/50 p-5 rounded-2xl shadow-sm hover:border-indigo-500/50 hover:bg-slate-800 transition-all cursor-default">
                                <a href="${res.url}" target="_blank" class="text-lg font-medium text-indigo-400 hover:text-indigo-300 truncate block mb-2">
                                    ${res.url}
                                </a>
                                <div class="flex items-center space-x-3">
                                    <span class="bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold px-2.5 py-1 rounded-md">
                                        Similarity: ${(res.score * 100).toFixed(1)}%
                                    </span>
                                    <span class="text-slate-500 text-sm">Conceptual Match</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    resultsDiv.innerHTML = '<div class="text-center text-slate-500 mt-8">No semantic matches found. Did you run the crawler?</div>';
                }
            } catch (err) {
                resultsDiv.innerHTML = '<div class="text-center text-red-400 mt-8">Error connecting to the search API.</div>';
            }
        }

        async function startCrawler() {
            const statusText = document.getElementById('statusText');
            statusText.classList.remove('hidden', 'text-emerald-400', 'text-red-400');
            statusText.classList.add('text-slate-500', 'animate-pulse');
            statusText.innerText = "Crawling and generating AI embeddings... Check Docker terminal.";
            
            try {
                // Adjust URL if your FastAPI endpoint name is different
                await fetch('/crawl', { method: 'POST' });
                statusText.classList.remove('animate-pulse', 'text-slate-500');
                statusText.classList.add('text-emerald-400');
                statusText.innerText = "Indexing complete! The vector space is ready to search.";
            } catch (err) {
                statusText.classList.remove('animate-pulse', 'text-slate-500');
                statusText.classList.add('text-red-400');
                statusText.innerText = "Error reaching the crawler endpoint.";
            }
        }
        
        // Trigger search on Enter key press
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
